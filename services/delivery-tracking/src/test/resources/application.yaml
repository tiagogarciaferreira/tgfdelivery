spring:
  application:
    name: delivery-tracking
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/deliverydb_test
    username: postgres
    password: postgres

server:
  port: 8081